version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: rwanda-music-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rwanda_music_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: rwanda-music-hub-api
    depends_on:
      - postgres
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rwanda_music_hub?schema=public
      NODE_ENV: development
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  postgres_data:
